set -g mouse on

# Enable focus events for proper Neovim auto-reload
set -g focus-events on

# Remove delay for escape sequences (improves Neovim responsiveness)
set -sg escape-time 0

# Terminal overrides for proper color and focus event support
set -ga terminal-overrides ',*256color*:smcup@:rmcup@'
set -ga terminal-overrides ',*:Ss=\E[%p1%d q:Se=\E[2 q'
